{% extends 'base.html' %}

{% block title %}Admin Access — NDAEB Prep{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-5 col-lg-4">
    <div class="surface-card p-4" style="border-top:3px solid var(--teal);">
      <div class="text-center mb-4">
        <h3 class="fw-bold">Admin access</h3>
        <p style="color:var(--slate);" class="small mb-0">Enter administrator credentials to continue.</p>
      </div>

      <form method="POST" action="{% url 'admin_login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Admin username</label>
          <input type="text" name="username" class="form-control" required />
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Admin password</label>
          <input type="password" name="password" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Sign in to admin panel</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
